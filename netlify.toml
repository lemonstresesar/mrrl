# ==============================================================================
# CONFIGURATION DE DÉPLOIEMENT NETLIFY (HGD MEDIGEST)
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 1. Redirection des requêtes API REST vers la fonction Serverless Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/.netlify/functions/api/*"
  to = "/.netlify/functions/api"
  status = 200

# 2. Redirection des routes SPA (Single Page Application) vers index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 3. En-têtes HTTP de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
